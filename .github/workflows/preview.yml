name: Preview

# Deploys each pull request to https://<SITE_DOMAIN>/pr-<number>/ and removes it when the PR is
# closed. Uses the deploy-preview role, which can only write pr-* keys (ADR-0014).
# Until the repository variables are registered (infra/README.md), both jobs are skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}

jobs:
  deploy:
    # Same-repository PRs only: fork PRs get no OIDC token for this account.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_ROLE_ARN_PREVIEW != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check required variables
        run: .github/scripts/require-vars.sh AWS_REGION S3_BUCKET CF_DISTRIBUTION_ID SITE_DOMAIN

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_BASE: /pr-${{ github.event.pull_request.number }}/
          VITE_PR_NUMBER: ${{ github.event.pull_request.number }}
          VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: VITE_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" pnpm --filter @retro-action-engine/player build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PREVIEW }}
          role-session-name: preview-pr-${{ github.event.pull_request.number }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check that the preview role cannot write outside pr-*
        run: >-
          .github/scripts/check-preview-deny.sh "$S3_BUCKET"
          "_deny-check/pr-${PR_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"

      - name: Upload
        run: .github/scripts/sync-site.sh preview apps/player/dist "$S3_BUCKET" "$PR_NUMBER"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID"
          --paths "/pr-${PR_NUMBER}/*" --query 'Invalidation.Id' --output text

      - name: Comment the preview URL
        uses: actions/github-script@v9
        env:
          COMMENT_BODY: |
            **Preview:** https://${{ vars.SITE_DOMAIN }}/pr-${{ github.event.pull_request.number }}/

            Commit `${{ github.event.pull_request.head.sha }}`. Updated on every push, removed when the PR is closed.
        with:
          script: |
            const marker = '<!-- retro-action-engine:preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const body = `${marker}\n${process.env.COMMENT_BODY}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_ROLE_ARN_PREVIEW != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check required variables
        run: .github/scripts/require-vars.sh AWS_REGION S3_BUCKET CF_DISTRIBUTION_ID

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PREVIEW }}
          role-session-name: preview-cleanup-pr-${{ github.event.pull_request.number }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Remove the preview
        run: aws s3 rm "s3://${S3_BUCKET}/pr-${PR_NUMBER}/" --recursive --no-progress

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID"
          --paths "/pr-${PR_NUMBER}/*" --query 'Invalidation.Id' --output text

      - name: Update the preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- retro-action-engine:preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            const body = `${marker}\n**Preview:** removed because the PR was closed. Reopen the PR to deploy it again.`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
