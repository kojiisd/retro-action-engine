<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>retro-action-engine</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #e8e8e8;
        background: #000;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .stage canvas {
        image-rendering: pixelated;
      }
      /* The virtual pad (docs/input-and-feel.md 9). In landscape it sits over the game screen,
         see-through; in portrait the game screen moves up and the pad takes the space below. */
      .touch-area {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        z-index: 1;
        pointer-events: none;
      }
      .touch-area .touch-pad {
        pointer-events: auto;
        opacity: var(--touch-opacity, 0.5);
      }
      @media (orientation: portrait) {
        body.touch {
          --game-height: calc(
            (100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) *
              var(--game-ratio, 0.5625)
          );
        }
        body.touch .stage {
          bottom: auto;
          height: var(--game-height);
        }
        body.touch .touch-area {
          top: calc(env(safe-area-inset-top) + var(--game-height));
        }
        body.touch .touch-area .touch-pad {
          opacity: 1;
        }
      }
      .build-info {
        position: fixed;
        top: 2px;
        right: 8px;
        margin: 0;
        font-size: 11px;
        font-family: ui-monospace, monospace;
        opacity: 0.45;
        pointer-events: none;
        z-index: 2;
        /* One line, cut short on narrow screens so it never covers the HUD icons on the left. */
        max-width: 55vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .error {
        margin: 16px;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
