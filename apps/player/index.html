<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>retro-action-engine</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #e8e8e8;
        background: #000;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .stage canvas {
        image-rendering: pixelated;
      }
      /* The virtual pad (docs/input-and-feel.md 9). In landscape it sits over the game screen,
         see-through; in portrait the game screen moves up and the pad takes the space below. */
      .touch-area {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        z-index: 1;
        pointer-events: none;
      }
      .touch-area .touch-pad {
        pointer-events: auto;
        opacity: var(--touch-opacity, 0.5);
      }
      @media (orientation: portrait) {
        body.touch {
          --game-height: calc(
            (100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) *
              var(--game-ratio, 0.5625)
          );
        }
        body.touch .stage {
          bottom: auto;
          height: var(--game-height);
        }
        body.touch .touch-area {
          top: calc(env(safe-area-inset-top) + var(--game-height));
        }
        body.touch .touch-area .touch-pad {
          opacity: 1;
        }
      }
      /* The gear in the HUD band's right end opens the settings (docs/input-and-feel.md 4.3). */
      .settings-button {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 2px);
        right: calc(env(safe-area-inset-right) + 4px);
        z-index: 3;
        width: 40px;
        height: 40px;
        padding: 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #e8e8e8;
        opacity: 0.75;
        cursor: pointer;
        touch-action: manipulation;
      }
      .settings-button:hover,
      .settings-button:focus-visible {
        opacity: 1;
        background: rgb(255 255 255 / 0.12);
      }
      .settings-button svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .settings {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: grid;
        place-items: center;
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        background: rgb(0 0 0 / 0.7);
      }
      .settings[hidden] {
        display: none;
      }
      .settings-panel {
        box-sizing: border-box;
        width: min(560px, 100%);
        max-height: 100%;
        overflow: auto;
        padding: 16px 20px;
        border-radius: 12px;
        background: #1c1d22;
        color: #e8e8e8;
        font-size: 15px;
      }
      .settings-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .settings h2 {
        margin: 0;
        font-size: 20px;
      }
      .settings h3 {
        margin: 16px 0 8px;
        font-size: 15px;
        opacity: 0.8;
      }
      .settings button {
        font: inherit;
        color: inherit;
        border: 1px solid rgb(255 255 255 / 0.3);
        border-radius: 6px;
        background: rgb(255 255 255 / 0.08);
        padding: 4px 12px;
        cursor: pointer;
        min-height: 32px;
      }
      .settings button:hover,
      .settings button:focus-visible {
        background: rgb(255 255 255 / 0.18);
      }
      .settings-bindings {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .settings-row {
        display: grid;
        grid-template-columns: 9em 1fr auto;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid rgb(255 255 255 / 0.08);
      }
      .settings-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .settings-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0 0 0 8px;
        border-radius: 6px;
        background: rgb(255 255 255 / 0.12);
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .settings .settings-remove {
        min-height: 28px;
        padding: 0 8px;
        border: 0;
        background: transparent;
      }
      .settings-conflict {
        outline: 1px solid #e0b040;
      }
      .settings-warn {
        color: #e0b040;
      }
      .settings-unbound {
        opacity: 0.6;
        font-size: 13px;
      }
      .settings-capturing {
        background: rgb(80 140 255 / 0.15);
      }
      .settings-prompt {
        font-size: 13px;
        color: #9cc0ff;
      }
      .settings-reset {
        margin-top: 10px;
      }
      .settings-option {
        display: block;
        padding: 4px 0;
      }
      .settings-footer {
        margin-top: 16px;
        font-size: 12px;
        opacity: 0.6;
      }
      .settings-footer p {
        margin: 4px 0;
        overflow-wrap: anywhere;
      }
      @media (max-width: 480px) {
        .settings-row {
          grid-template-columns: 1fr auto;
        }
        .settings-chips {
          grid-column: 1 / -1;
          grid-row: 2;
        }
      }
      .error {
        margin: 16px;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
